<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGEN Onboarding Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F2C014'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='%2314181C' font-family='Arial' font-weight='bold'>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1180px}
.login{max-width:400px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 30px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent)}
.login h1{font-family:var(--display);font-size:22px;margin:22px 0 4px}
.login p{color:var(--muted);font-size:14px;margin-bottom:22px}
.login .f{margin-bottom:14px}
.login .btn{width:100%;margin-top:6px}
.lerr{display:none;background:var(--red-wash);color:#F87171;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-ring);border-radius:6px;padding:3px 7px}

#app{display:none}
.bar-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.bar-top .logo{margin-right:auto}
.who{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.hot b{color:var(--accent)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools .inp{max-width:320px;padding:10px 14px}
.tools select.inp{max-width:180px}
.link-gen{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.link-gen .inp{max-width:200px}
.btn-sm{padding:10px 14px;font-size:13.5px;border-radius:10px}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 120px 110px;gap:14px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.row:hover{border-color:var(--line-2);background:var(--card-2)}
.row.is-new{border-left:3px solid var(--accent)}
.r-biz{font-weight:600}
.r-sub{font-size:12.5px;color:var(--muted)}
.r-date{font-size:13px;color:var(--text-2)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;text-align:center}
.st-new{background:var(--accent-wash);color:var(--accent)}
.st-reviewed{background:rgba(96,165,250,.12);color:#93C5FD}
.st-onboarded{background:var(--green-wash);color:#34D399}
.st-archived{background:rgba(150,154,160,.12);color:var(--muted)}
.empty-big{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.d-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.d-head h2{font-family:var(--display);font-size:21px;letter-spacing:-.02em}
.d-head .r-sub{margin-top:2px}
.d-close{margin-left:auto}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line)}
.d-actions select.inp{width:auto;padding:9px 34px 9px 12px;font-size:13.5px}
.d-body{flex:1;overflow-y:auto;padding:22px 24px 60px}
.internal{background:var(--card);border:1px solid var(--accent-ring);border-radius:14px;padding:18px;margin-bottom:24px}
.internal h3{font-family:var(--display);font-size:14px;color:var(--accent);margin-bottom:12px;letter-spacing:.02em}
.internal .grid{gap:12px}
.internal .inp{padding:10px 12px;font-size:14px}
.btn-danger{background:transparent;color:#F87171;border:1px solid rgba(220,38,38,.4)}
.btn-danger:hover{background:var(--red-wash)}

@media (max-width:820px){
  .stats{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:1fr auto;gap:6px}
  .row .r-contact,.row .r-date{display:none}
  .link-gen{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginView">
    <form class="login" id="loginForm">
      <div class="logo"><div class="logo-mark">K</div>KGEN <span class="demo-tag" id="demoTag" style="display:none">DEMO</span></div>
      <h1>Onboarding submissions</h1>
      <p>Team login. Use your KGEN CRM username and password.</p>
      <div class="lerr" id="lerr"></div>
      <div class="f"><label for="lu">Username</label><input class="inp" id="lu" autocomplete="username" required></div>
      <div class="f"><label for="lp">Password</label><input class="inp" id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-accent" type="submit" id="lbtn">Sign in</button>
    </form>
  </div>

  <div id="app">
    <div class="bar-top">
      <div class="logo"><div class="logo-mark">K</div>Onboarding</div>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
      <button class="btn btn-ghost btn-sm" id="logout">Sign out</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input class="inp" id="q" placeholder="Search business, name, email...">
      <select class="inp" id="fStatus"><option value="">All statuses</option><option value="new">New</option><option value="reviewed">Reviewed</option><option value="onboarded">Onboarded</option><option value="archived">Archived</option></select>
      <div class="link-gen">
        <input class="inp" id="refIn" placeholder="client name (optional)">
        <button class="btn btn-accent btn-sm" id="copyLink">Copy client link</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="d-head"><div><h2 id="dTitle"></h2><div class="r-sub" id="dSub"></div></div><button class="mini d-close" id="dClose" aria-label="Close">×</button></div>
  <div class="d-actions">
    <select class="inp" id="dStatus"><option value="new">New</option><option value="reviewed">Reviewed</option><option value="onboarded">Onboarded</option><option value="archived">Archived</option></select>
    <button class="btn btn-ghost btn-sm" id="dCopy">Copy as text</button>
    <button class="btn btn-ghost btn-sm" id="dJson">Download JSON</button>
    <button class="btn btn-danger btn-sm" id="dDel" style="margin-left:auto">Delete</button>
  </div>
  <div class="d-body" id="dBody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="fields.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
